<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Invoice Tax Determination Flow</title>
  <desc id="desc">A flowchart showing how invoice facts connect to PO records, task codes, line classification, state taxability rules, expected tax, history, and approval or human review.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#36576f"/>
    </marker>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #17324d; }
      .subtitle { font: 400 18px Georgia, serif; fill: #52697c; }
      .node-title { font: 700 18px 'Segoe UI', sans-serif; fill: #17324d; }
      .node-copy { font: 400 15px 'Segoe UI', sans-serif; fill: #40586b; }
      .small { font: 600 13px 'Segoe UI', sans-serif; fill: #40586b; }
      .branch { font: 700 16px 'Segoe UI', sans-serif; fill: #17324d; }
      .source-title { font: 700 15px 'Segoe UI', sans-serif; fill: #17324d; }
      .source-copy { font: 400 13px 'Segoe UI', sans-serif; fill: #40586b; }
      .line { fill: none; stroke: #36576f; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7590a3; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1280" fill="#f4f7f5"/>
  <path d="M0 0 H1600 V165 C1240 112 955 220 600 154 C360 110 170 126 0 184 Z" fill="#dcebe5"/>
  <circle cx="1460" cy="110" r="160" fill="#e9d8a6" opacity="0.5"/>

  <text x="90" y="76" class="title">Invoice Tax Determination Flow</text>
  <text x="92" y="112" class="subtitle">Invoice facts are authoritative. Reference records must agree before they can drive tax treatment.</text>

  <!-- Connectors behind nodes -->
  <path class="line" d="M580 262 V300"/>
  <path class="line" d="M580 390 V428"/>
  <path class="line" d="M580 518 V556"/>
  <path class="line" d="M580 646 V684"/>
  <path class="line" d="M580 774 V812"/>
  <path class="line" d="M580 902 V946"/>
  <path class="line" d="M580 1036 V1080"/>
  <path class="line" d="M580 1170 V1210"/>

  <path class="line" d="M830 345 H1040"/>
  <path class="line" d="M830 857 H1040"/>
  <path class="line" d="M830 1125 H1040"/>

  <!-- Main flow -->
  <g filter="url(#shadow)">
    <rect x="330" y="172" width="500" height="90" rx="8" fill="#ffffff" stroke="#4e7f75" stroke-width="3"/>
    <circle cx="378" cy="217" r="25" fill="#1f6f5f"/>
    <text x="378" y="224" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="420" y="207" class="node-title">Extract invoice facts</text>
    <text x="420" y="234" class="node-copy">Printed PO, vendor, ship-to/service site, lines, totals and tax</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="300" width="500" height="90" rx="8" fill="#ffffff" stroke="#4e7f75" stroke-width="3"/>
    <circle cx="378" cy="345" r="25" fill="#1f6f5f"/>
    <text x="378" y="352" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="420" y="335" class="node-title">Resolve and verify PO record</text>
    <text x="420" y="362" class="node-copy">Exact PO first; then confirm vendor, state, site and work type</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="300" width="420" height="90" rx="8" fill="#fff4e5" stroke="#c97820" stroke-width="3"/>
    <text x="1080" y="335" class="node-title">PO mismatch or weak candidate</text>
    <text x="1080" y="362" class="node-copy">Do not inherit its task or location. Route to review.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="428" width="500" height="90" rx="8" fill="#ffffff" stroke="#4e7f75" stroke-width="3"/>
    <circle cx="378" cy="473" r="25" fill="#1f6f5f"/>
    <text x="378" y="480" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="420" y="463" class="node-title">Resolve and validate task code</text>
    <text x="420" y="490" class="node-copy">Confirm asset class and capitalization agree with invoice work</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="556" width="500" height="90" rx="8" fill="#ffffff" stroke="#4e7f75" stroke-width="3"/>
    <circle cx="378" cy="601" r="25" fill="#1f6f5f"/>
    <text x="378" y="608" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">4</text>
    <text x="420" y="591" class="node-title">Classify each invoice line</text>
    <text x="420" y="618" class="node-copy">Keep hardware, labor, freight, software and services separate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="684" width="500" height="90" rx="8" fill="#ffffff" stroke="#4e7f75" stroke-width="3"/>
    <circle cx="378" cy="729" r="25" fill="#1f6f5f"/>
    <text x="378" y="736" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">5</text>
    <text x="420" y="719" class="node-title">Determine governing state</text>
    <text x="420" y="746" class="node-copy">Use service or ship-to location, not the bill-to address</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="812" width="500" height="90" rx="8" fill="#ffffff" stroke="#4e7f75" stroke-width="3"/>
    <circle cx="378" cy="857" r="25" fill="#1f6f5f"/>
    <text x="378" y="864" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">6</text>
    <text x="420" y="847" class="node-title">Look up state x item type</text>
    <text x="420" y="874" class="node-copy">Read the matrix taxability code for every line</text>
  </g>

  <!-- Taxability branches -->
  <g filter="url(#shadow)">
    <rect x="1040" y="790" width="130" height="82" rx="8" fill="#dff1e8" stroke="#237a57" stroke-width="3"/>
    <text x="1105" y="824" text-anchor="middle" class="branch">T</text>
    <text x="1105" y="850" text-anchor="middle" class="small">Taxable</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190" y="790" width="130" height="82" rx="8" fill="#e5edf3" stroke="#567287" stroke-width="3"/>
    <text x="1255" y="824" text-anchor="middle" class="branch">E</text>
    <text x="1255" y="850" text-anchor="middle" class="small">Exempt</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1340" y="790" width="130" height="82" rx="8" fill="#fff0df" stroke="#c97820" stroke-width="3"/>
    <text x="1405" y="824" text-anchor="middle" class="branch">A</text>
    <text x="1405" y="850" text-anchor="middle" class="small">Review</text>
  </g>
  <path d="M1040 857 H1010 V831 H1040" fill="none" stroke="#36576f" stroke-width="3"/>
  <path d="M1170 831 H1190" class="line"/>
  <path d="M1320 831 H1340" class="line"/>

  <g filter="url(#shadow)">
    <rect x="330" y="946" width="500" height="90" rx="8" fill="#ffffff" stroke="#4e7f75" stroke-width="3"/>
    <circle cx="378" cy="991" r="25" fill="#1f6f5f"/>
    <text x="378" y="998" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">7</text>
    <text x="420" y="981" class="node-title">Calculate expected tax</text>
    <text x="420" y="1008" class="node-copy">Taxable line amount x available jurisdiction rate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="330" y="1080" width="500" height="90" rx="8" fill="#ffffff" stroke="#4e7f75" stroke-width="3"/>
    <circle cx="378" cy="1125" r="25" fill="#1f6f5f"/>
    <text x="378" y="1132" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">8</text>
    <text x="420" y="1115" class="node-title">Compare and support</text>
    <text x="420" y="1142" class="node-copy">Compare charged tax; consult reviewed history last</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="1080" width="200" height="90" rx="8" fill="#dff1e8" stroke="#237a57" stroke-width="3"/>
    <text x="1140" y="1119" text-anchor="middle" class="node-title">Auto-approve</text>
    <text x="1140" y="1146" text-anchor="middle" class="small">All checks pass</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1260" y="1080" width="210" height="90" rx="8" fill="#fff0df" stroke="#c97820" stroke-width="3"/>
    <text x="1365" y="1119" text-anchor="middle" class="node-title">Human review</text>
    <text x="1365" y="1146" text-anchor="middle" class="small">Mismatch or uncertainty</text>
  </g>
  <path d="M1240 1125 H1260" class="line"/>

  <g filter="url(#shadow)">
    <rect x="330" y="1210" width="500" height="54" rx="8" fill="#17324d"/>
    <text x="580" y="1244" text-anchor="middle" font-family="Segoe UI" font-size="18" font-weight="700" fill="#ffffff">Evidence package: facts + matches + rules + calculations + decision</text>
  </g>

  <!-- Data source rail -->
  <text x="900" y="190" class="node-title">REFERENCE DATA</text>
  <text x="900" y="216" class="node-copy">Used only after invoice facts are extracted</text>

  <g filter="url(#shadow)">
    <rect x="900" y="235" width="570" height="92" rx="8" fill="#edf4f1" stroke="#79998f" stroke-width="2"/>
    <text x="930" y="268" class="source-title">seed-po-records.json</text>
    <text x="930" y="294" class="source-copy">Canonical PO, aliases, vendor, project, task code, state and site</text>
  </g>
  <path class="dash" d="M900 281 H860 V345 H832"/>

  <g filter="url(#shadow)">
    <rect x="900" y="427" width="570" height="92" rx="8" fill="#edf4f1" stroke="#79998f" stroke-width="2"/>
    <text x="930" y="460" class="source-title">seed-task-codes.json</text>
    <text x="930" y="486" class="source-copy">Task description, asset class, capitalization and depreciation</text>
  </g>
  <path class="dash" d="M900 473 H832"/>

  <g filter="url(#shadow)">
    <rect x="900" y="671" width="570" height="92" rx="8" fill="#edf4f1" stroke="#79998f" stroke-width="2"/>
    <text x="930" y="704" class="source-title">seed-taxability-matrix.json</text>
    <text x="930" y="730" class="source-copy">State x item type gives T, E or A; also supplies base state rate</text>
  </g>
  <path class="dash" d="M900 717 H860 V857 H832"/>

  <g filter="url(#shadow)">
    <rect x="900" y="948" width="570" height="92" rx="8" fill="#edf4f1" stroke="#79998f" stroke-width="2"/>
    <text x="930" y="981" class="source-title">seed-history.json</text>
    <text x="930" y="1007" class="source-copy">Similar reviewed outcomes support confidence; they never override rules</text>
  </g>
  <path class="dash" d="M900 994 H860 V1125 H832"/>

  <text x="1040" y="1210" class="small">Review triggers: weak PO match | task conflict | matrix A | mixed lines</text>
  <text x="1040" y="1234" class="small">missing local rate | tax variance | failed grounding or confidence</text>
  <text x="1040" y="1262" class="source-copy">Base state rates alone may not include city, county or district tax.</text>
</svg>
